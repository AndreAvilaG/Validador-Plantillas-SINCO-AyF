name: Mantener despierta la app de Streamlit

# Este workflow evita que Streamlit Community Cloud duerma la app por
# inactividad (lo hace automáticamente a las 12 horas sin visitas). Al
# visitarla cada pocas horas, el contador de inactividad nunca llega a
# cumplirse, así que nadie ve la pantalla en inglés de "app dormida".

on:
  schedule:
    # Cada 6 horas — bien por debajo de las 12 horas que usa Streamlit Cloud
    # para dormir una app. Ajusta el número si tu app tarda en dormirse más
    # o menos tiempo.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Permite además ejecutarlo manualmente desde la pestaña "Actions" de
    # GitHub, sin tener que esperar al horario programado.

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar la app para renovar su actividad
        run: |
          echo "Visitando la app..."
          curl -sL -o /dev/null -w "Código de respuesta: %{http_code}\n" \
            "https://sincopys-validador-plantillas.streamlit.app/" \
            --max-time 60 --retry 2 --retry-delay 10
