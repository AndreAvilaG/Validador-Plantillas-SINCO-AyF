# Configuración de seguridad y límites de la app.
# Este archivo debe vivir en la carpeta ".streamlit/" en la RAÍZ de tu
# repositorio de GitHub (al mismo nivel que validador_sinco_ayf.py), no dentro
# de otra carpeta. Streamlit lo detecta automáticamente al desplegar.

[server]
# Límite de tamaño por archivo subido, en MB. El valor por defecto de
# Streamlit es 200 MB — demasiado permisivo para plantillas contables, que
# normalmente pesan unos pocos MB incluso con miles de filas. 25 MB deja
# margen amplio sin exponer la app a archivos diseñados para agotar memoria.
maxUploadSize = 25

# No mostrar detalles internos de errores (tracebacks) a los usuarios finales.
# Con esto en false, un error inesperado muestra un mensaje genérico en vez
# de exponer nombres de variables, rutas internas o fragmentos de datos.
enableXsrfProtection = true

[client]
# Evita que se muestren tracebacks completos de Python en la interfaz cuando
# algo falla — reduce el riesgo de que un error revele información interna
# (nombres de columnas, rutas, fragmentos de datos) a un usuario externo.
showErrorDetails = false
